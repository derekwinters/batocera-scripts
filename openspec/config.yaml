schema: spec-driven

# Project context, shown to AI when creating artifacts.
# Full context lives in openspec/project.md.
context: |
  Scripts and config for a home arcade running Batocera Linux (EmulationStation,
  RetroArch/libretro) on a Minisforum mini PC with a 27-inch 4K monitor.
  Four Micro Center arcade kits are always attached (players 1-4); SNES, N64,
  PlayStation-style USB controllers and a Sinden Light Gun are attached as needed.
  Persistent device config lives under /userdata (e.g. /userdata/system/batocera.conf).
  Read openspec/project.md and openspec/specs/ before proposing changes.
  Mark unknown hardware facts as TBD; never invent them.


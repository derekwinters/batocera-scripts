# Sinden Light Gun settings for this arcade.
#
# Batocera does NOT load this file automatically. Its lines are copied by hand
# into /userdata/system/batocera.conf and kept in sync with it until automated
# backup/restore (issue #12) exists.

# Crosshairs. mame_crosshair: disabled / enabled (always shown) / onmove
# (left to MAME: only shown while the gun moves).
mame.mame2003-plus_crosshair_enabled=enabled
naomi.reicast_lightgun1_crosshair=Blue
naomi.reicast_lightgun2_crosshair=Red

# Time Crisis: standalone MAME, gun mode and an always-on crosshair
# (see openspec change fix-time-crisis-light-gun).
mame["timecris.zip"].core=mame
mame["timecris.zip"].emulator=mame
mame["timecris.zip"].use_guns=1
mame["timecris.zip"].mame_crosshair=enabled

# Big Buck Hunter Pro: Dolphin crosshair.
wii["Big Buck Hunter Pro (USA).rvz"].dolphin_crosshair=1

# Sinden border. With the default bordersmode "auto", Batocera draws the white
# border in every game while a Sinden is connected. Hide it globally, then turn
# it back on per gun game (the Sinden tracks the white frame, so gun games need
# it). The per-game key overrides the global one.
# To add a new gun game, add one more <system>["<rom>"].bordersmode=normal line.
controllers.guns.bordersmode=hidden
mame["duckhunt.zip"].bordersmode=normal
mame["le2.zip"].bordersmode=normal
mame["lethalen.zip"].bordersmode=normal
mame["opwolf.zip"].bordersmode=normal
mame["othunder.zip"].bordersmode=normal
mame["timecris.zip"].bordersmode=normal
naomi["hotd2.zip"].bordersmode=normal
wii["Big Buck Hunter Pro (USA).rvz"].bordersmode=normal
